name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach real notes, personal handwriting, screenshots of private pages or API keys.
        Security problems: use Security → Report a vulnerability instead.
  - type: input
    id: version
    attributes:
      label: HandNote version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: obsidian
    attributes:
      label: Obsidian version and device
      placeholder: "Obsidian 1.14.5, iPad Pro 11 (M2), iPadOS 26.1, Apple Pencil Pro"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. New HandNote 2. Lasso … 3. Convert → Text"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional, no personal content)
      description: ⋯ menu → Copy input diagnostics / performance report, or Settings → Local recognition → Run self-test → Copy.
      render: text
  - type: checkboxes
    id: data
    attributes:
      label: Data
      options:
        - label: A note was lost or damaged (we treat this as the highest priority)
